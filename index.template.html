<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>雨夜の街角 — HOSHIMART</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, #102434 0%, #08131f 38%, #04080d 72%, #010203 100%);
    }
    body {
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100% !important;
      height: 100% !important;
      cursor: grab;
      outline: none;
      touch-action: none;
    }
    canvas:active { cursor: grabbing; }
  </style>
</head>

</html>
